# =====================================================================
# Otormín Automóviles - Bot de WhatsApp 24/7
# n8n (modo queue: principal + worker) + Postgres + Redis (+ Caddy HTTPS)
#
#   cp .env.example .env      # completar los valores
#   docker compose --profile https up -d     # con Caddy y certificado automático
#   docker compose up -d                     # sin Caddy (si ya tenés tu proxy HTTPS)
#
# Todo reinicia solo (restart: unless-stopped), también si se reinicia el servidor.
# =====================================================================
name: otormin

x-n8n-comun: &n8n-comun
  image: n8nio/n8n:${N8N_VERSION:-2.44.4}
  restart: unless-stopped
  environment:
    # --- Base de datos interna de n8n ---
    DB_TYPE: postgresdb
    DB_POSTGRESDB_HOST: postgres
    DB_POSTGRESDB_PORT: 5432
    DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
    DB_POSTGRESDB_USER: ${POSTGRES_USER}
    DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
    # --- Modo queue (las ejecuciones las corre el worker) ---
    EXECUTIONS_MODE: queue
    QUEUE_BULL_REDIS_HOST: redis
    QUEUE_BULL_REDIS_PORT: 6379
    QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
    QUEUE_BULL_REDIS_DB: 0
    QUEUE_HEALTH_CHECK_ACTIVE: "true"
    OFFLOAD_MANUAL_EXECUTIONS_TO_WORKERS: "true"
    # --- Seguridad y URLs ---
    N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
    N8N_HOST: ${N8N_HOST}
    N8N_PROTOCOL: https
    N8N_PORT: 5678
    WEBHOOK_URL: https://${N8N_HOST}/
    N8N_EDITOR_BASE_URL: https://${N8N_HOST}/
    N8N_PROXY_HOPS: 1
    N8N_SECURE_COOKIE: "true"
    # --- Zona horaria: Uruguay ---
    GENERIC_TIMEZONE: America/Montevideo
    TZ: America/Montevideo
    # --- Archivos (audios/fotos descargados): en modo queue van a la base de datos ---
    N8N_DEFAULT_BINARY_DATA_MODE: database
    # --- Limpieza de ejecuciones viejas (14 días) ---
    EXECUTIONS_DATA_PRUNE: "true"
    EXECUTIONS_DATA_MAX_AGE: 336
    EXECUTIONS_DATA_SAVE_ON_ERROR: all
    EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
    # --- Varios ---
    N8N_DIAGNOSTICS_ENABLED: "false"
    N8N_PERSONALIZATION_ENABLED: "false"
    # n8n 2.x escucha en IPv6 (::) por defecto; muchos contenedores no tienen IPv6
    N8N_LISTEN_ADDRESS: 0.0.0.0
    N8N_WORKER_SERVER_ADDRESS: 0.0.0.0
    # Code nodes: runner interno (anda con 2.44; si se actualiza n8n, revisar el modo "external")
    N8N_RUNNERS_MODE: internal
    NODE_ENV: production
  volumes:
    - n8n_data:/home/node/.n8n
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine   # n8n 2.x pide Postgres 17 o más nuevo
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
      OTORMIN_DB_NAME: ${OTORMIN_DB_NAME:-otormin}
      TZ: America/Montevideo
      PGTZ: America/Montevideo
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/init:/docker-entrypoint-initdb.d:ro
      - ./sql/schema.sql:/otormin/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${N8N_DB_NAME:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # Proceso principal: editor, webhooks (ManyChat le pega acá) y schedules.
  n8n:
    <<: *n8n-comun
    ports:
      - "127.0.0.1:5678:5678"   # solo local: el acceso público entra por Caddy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5678/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Worker: ejecuta los workflows. Para más carga: docker compose up -d --scale n8n-worker=2
  n8n-worker:
    <<: *n8n-comun
    command: worker --concurrency=${N8N_WORKER_CONCURRENCY:-10}
    depends_on:
      n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5678/healthz', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # HTTPS automático (Let's Encrypt). ManyChat exige una URL https pública.
  # Se levanta con: docker compose --profile https up -d
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    ports:
      - "80:80"
      - "443:443"
    environment:
      N8N_HOST: ${N8N_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - n8n

volumes:
  n8n_data:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
